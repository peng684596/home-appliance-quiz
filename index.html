<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小家电理论题库 · 练习站</title>
<meta name="description" content="2024年全国行业职业技能竞赛——第四届全国工业设计职业技能大赛 决赛理论试题库（小型家用电器制造工）在线练习：分型练习、模拟考试、错题本、收藏、记忆曲线复习、统计与备份。数据仅存本机浏览器。">
<style>
/* SECTION: theme —— 现代人文主义暖调学院风 */
:root{
  --bg:#F4EFE5;
  --card:#FFFFFF;
  --line:#E0D8C6;
  --line-strong:#CFC5AE;
  --ink:#2E2A24;
  --ink-2:#6B6459;
  --blue:#2F4858;
  --green:#3E5C50;
  --red:#A24936;
  --orange:#C0763A;
  --blue-soft:#EEF2F4;
  --green-soft:#EDF2EF;
  --red-soft:#F6EDEA;
  --orange-soft:#F6EFE6;
  --radius:6px;
  --shadow:0 1px 2px rgba(46,42,36,.04);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
h1,h2,h3,.brand,.serif{font-family:var(--serif);font-weight:600}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 24px;padding:14px 16px}
.brand{font-size:19px;color:var(--blue);letter-spacing:.5px}
.brand-sub{display:block;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-2);letter-spacing:0}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.nav a{padding:6px 10px;border-radius:var(--radius);font-size:14px;color:var(--ink-2);border:1px solid transparent}
.nav a.on{color:var(--blue);border-color:var(--line-strong);background:var(--blue-soft)}
main{padding:24px 16px 48px}
.foot{padding:20px 16px 32px;color:var(--ink-2);font-size:12px;border-top:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card h2{font-size:18px;margin-bottom:4px;color:var(--blue)}
.card .sub{color:var(--ink-2);font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:14px 16px;box-shadow:var(--shadow)}
.tile .num{font-family:var(--serif);font-size:26px;color:var(--blue)}
.tile .lab{font-size:13px;color:var(--ink-2)}
.tile.g .num{color:var(--green)} .tile.r .num{color:var(--red)} .tile.o .num{color:var(--orange)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:var(--radius);padding:8px 16px;font-size:14px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{color:#fff;opacity:.92}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,input[type=number]{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--card);padding:7px 10px;font:inherit;color:var(--ink)}
label.ck{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--ink-2)}
.tag{border:1px solid var(--line-strong);border-radius:4px;padding:1px 8px;font-size:12px;color:var(--ink-2);background:var(--bg)}
.tag.b{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.tag.g{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.tag.r{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.tag.o{color:var(--orange);border-color:var(--orange);background:var(--orange-soft)}
.stem{font-size:16px;margin-bottom:14px;white-space:pre-wrap}
.fig{margin:0 0 14px;background:#F7FAFC;border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center}
.fig img{max-width:100%;height:auto;display:inline-block}
.fig .cap{font-size:12px;color:var(--ink-2);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:10px 14px;text-align:left;font-size:14.5px;line-height:1.6;color:var(--ink)}
.opt .ol{font-family:var(--serif);color:var(--ink-2);margin-right:8px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;font-size:14px;border-left:3px solid var(--line-strong);padding:6px 12px;background:var(--bg);border-radius:0 var(--radius) var(--radius) 0}
.fb.ok{border-left-color:var(--green);color:var(--green)}
.fb.bad{border-left-color:var(--red);color:var(--red)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--blue)}
.list{display:flex;flex-direction:column}
.list .item{border-top:1px solid var(--line);padding:12px 4px;display:flex;gap:12px;align-items:flex-start}
.list .item:first-child{border-top:0}
.item .no{font-family:var(--serif);color:var(--ink-2);min-width:64px;font-size:13px;padding-top:2px}
.item .tx{flex:1;min-width:0}
.item .tx .t{font-size:14.5px}
.item .ans{font-size:12.5px;color:var(--ink-2);margin-top:2px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.tb th{background:var(--bg);font-weight:600;color:var(--ink-2)}
.tb td.n,.tb th.n{text-align:center;white-space:nowrap}
.muted{color:var(--ink-2);font-size:13px}
.hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.examhead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;font-size:14px}
.clock{font-family:var(--serif);font-size:20px;color:var(--red);min-width:86px;text-align:right}
.empty{color:var(--ink-2);font-size:14px;padding:24px 0;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 12px;font-size:13.5px;background:var(--card);color:var(--ink-2)}
.chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
@media (max-width:640px){
  .topbar-in{padding:10px 12px}
  .nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .nav a{white-space:nowrap}
  .brand{font-size:17px}
  main{padding:16px 12px 40px}
  .card{padding:16px}
  .item .no{min-width:52px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#/home">小家电理论题库<span class="brand-sub">小型家用电器制造工 · 2024 全国工业设计职业技能大赛决赛题库</span></a>
    <nav class="nav" id="nav">
      <a href="#/home">首页</a>
      <a href="#/practice">分型练习</a>
      <a href="#/exam">模拟考试</a>
      <a href="#/review">记忆复习</a>
      <a href="#/wrong">错题本</a>
      <a href="#/star">收藏</a>
      <a href="#/stats">统计</a>
      <a href="#/settings">备份</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer class="foot wrap">
  <span>数据仅保存在本机浏览器，可随时在「备份」页导出 / 导入。</span>
</footer>
<script src="assets/js/questions.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
